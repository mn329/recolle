name: recolle
description: "A new Flutter project."
publish_to: "none"

version: 1.0.2+13

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  supabase_flutter: ^2.10.3
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.0.3
  hooks_riverpod: ^3.0.3
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0
  path: ^1.9.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  http: ^1.6.0
  url_launcher: ^6.3.2
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  liquid_glass_renderer: ^0.2.0-dev.4
  share_plus: ^12.0.2
  home_widget: ^0.9.2+1
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env

  fonts:
    - family: ZenKakuGothicNew
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/app_icon.png"

flutter_native_splash:
  color: "#000000"
  image: "lib/assets/app_icon.png"
  android: true
  ios: true
