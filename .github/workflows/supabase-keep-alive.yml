# Supabase 無料プランは「DB へのユーザークエリ」が少ないと約 7 日で一時停止する。
# Auth health だけでは不足なため、REST で records を SELECT する。
# GitHub の schedule は遅延・スキップがあり得るので、週 3 回実行する。
name: Supabase Keep Alive

on:
  schedule:
    # 月・水・金 03:00 UTC（日本時間 12:00）
    - cron: "0 3 * * 1,3,5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 <<'PY'
          import os
          import re
          import socket
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          PROJECT_REF_PATTERN = re.compile(r"^[a-z0-9]{10,32}$")
          HOST_PATTERN = re.compile(r"^([a-z0-9]{10,32})\.supabase\.co$")


          def clean(value: str) -> str:
              return (
                  value.strip()
                  .strip('"')
                  .strip("'")
                  .replace("\r", "")
                  .replace("\n", "")
              )


          def fail(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)


          def extract_project_ref(raw_value: str) -> str | None:
              value = clean(raw_value)
              if not value:
                  return None

              if "<" in value or ">" in value:
                  fail(
                      "Secret にプレースホルダー (<project-ref> など) が含まれています。"
                      " Supabase ダッシュボードの実際の Project URL を設定してください。"
                  )

              if "://" in value:
                  parsed = urlparse(value)
                  host = (parsed.hostname or "").lower()
                  match = HOST_PATTERN.match(host)
                  if match:
                      return match.group(1)
                  fail(
                      "SUPABASE_URL のホスト名が不正です。"
                      " https://<project-ref>.supabase.co 形式で設定してください。"
                  )

              lowered = value.lower().rstrip("/")
              host_match = HOST_PATTERN.match(lowered)
              if host_match:
                  return host_match.group(1)

              if PROJECT_REF_PATTERN.match(lowered):
                  return lowered

              return None


          def request_status(url: str, headers: dict[str, str]) -> int:
              request = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status
              except urllib.error.HTTPError as error:
                  return error.code
              except urllib.error.URLError as error:
                  fail(f"接続に失敗しました ({url}): {error.reason}")


          anon_key = clean(os.environ.get("SUPABASE_ANON_KEY", ""))
          if not anon_key:
              fail("GitHub Secrets に SUPABASE_ANON_KEY を設定してください。")

          project_ref = extract_project_ref(
              os.environ.get("SUPABASE_URL", "")
          ) or extract_project_ref(os.environ.get("SUPABASE_PROJECT_REF", ""))

          if not project_ref:
              fail(
                  "GitHub Secrets に SUPABASE_URL または SUPABASE_PROJECT_REF を設定してください。"
                  " 例: SUPABASE_URL=https://abcdefghijklmno.supabase.co"
              )

          if not PROJECT_REF_PATTERN.match(project_ref):
              fail(
                  f"project ref が不正です: {project_ref!r}。"
                  " Project Settings → API の Project URL を設定してください。"
              )

          base_url = f"https://{project_ref}.supabase.co"
          host = f"{project_ref}.supabase.co"

          try:
              socket.getaddrinfo(host, 443)
          except socket.gaierror:
              fail(
                  f"ホスト名を解決できません: {host}。"
                  " プロジェクトが削除・一時停止されていないか確認し、"
                  " ダッシュボードで Resume してから再実行してください。"
                  " keep-alive は停止前の予防のみで、停止後の復旧はできません。"
              )

          headers = {
              "apikey": anon_key,
              "Authorization": f"Bearer {anon_key}",
              "Accept": "application/json",
          }

          # DB への SELECT が「ユーザークエリ」としてカウントされる（公式ドキュメント準拠）
          db_url = f"{base_url}/rest/v1/records?select=id&limit=1"
          db_status = request_status(db_url, headers)
          print(f"Database query (records): HTTP {db_status}")

          if db_status < 200 or db_status >= 300:
              fail(
                  f"DB クエリが失敗しました (HTTP {db_status})。"
                  " anon key と records テーブルの RLS（SELECT）を確認してください。"
              )

          print("Supabase keep-alive ping succeeded.")
          PY
